services:
  db:
    image: postgres:17
    container_name: drape-db
    environment:
      POSTGRES_USER: drape
      POSTGRES_PASSWORD: drape
      POSTGRES_DB: drape
    ports:
      - "5433:5432"
    volumes:
      - drape-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drape -d drape"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  drape-pgdata:
