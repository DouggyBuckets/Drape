# Fly.io configuration. Secrets (ANTHROPIC_API_KEY, DATABASE_URL) are set with `fly secrets set`,
# never in this file. See https://fly.io/docs/reference/configuration/
app = 'drape'
primary_region = 'ord'

[build]

[deploy]
  # Runs in a one-off machine before new code takes traffic; a failed migration aborts the deploy.
  release_command = 'node dist/db/migrate.js'

[env]
  NODE_ENV = 'production'   # Secure session cookies
  PORT = '3000'
  TRUST_PROXY = '1'         # Fly's edge proxy is one hop; req.ip is then the real client IP
  DAILY_SPEND_CAP_USD = '3'

[http_service]
  internal_port = 3000
  force_https = true
  # One machine always running, so a recruiter's first click never waits for a cold start.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
